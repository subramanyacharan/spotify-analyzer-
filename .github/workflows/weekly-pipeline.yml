name: Weekly Pipeline

on:
  schedule:
    # Every Sunday at 05:00 UTC. GitHub Actions cron uses UTC only.
    # Examples: 05:00 EET (UTC+2) -> "0 3 * * 0" | 05:00 EST (UTC-5) -> "0 10 * * 0"
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: false
        default: incremental
        type: choice
        options:
          - incremental
          - full

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run weekly insight pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      VERCEL_DASHBOARD_URL: ${{ secrets.VERCEL_DASHBOARD_URL }}
      EMBEDDING_BACKEND: local
      CHROMA_PERSIST_DIR: ./data/chroma_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore ChromaDB and model caches
        uses: actions/cache@v4
        with:
          path: |
            data/chroma_db
            ~/.cache/huggingface
            ~/.cache/torch
          key: pipeline-chroma-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pipeline-chroma-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps "app-store-scraper>=0.3.5"
          pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          python -c "import urllib3, requests, spacy; spacy.load('en_core_web_sm'); print('deps ok')"

      - name: Validate secrets
        run: |
          missing=()
          test -n "$SUPABASE_URL" || missing+=("SUPABASE_URL")
          test -n "$SUPABASE_KEY" || missing+=("SUPABASE_KEY or SUPABASE_SERVICE_ROLE_KEY")
          test -n "$GROQ_API_KEY" || missing+=("GROQ_API_KEY")
          if [ -z "${GROQ_MODEL// }" ]; then
            echo "::warning::GROQ_MODEL secret is empty — pipeline will use default llama-3.3-70b-versatile"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Run scheduled pipeline
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          python scripts/run_scheduled_pipeline.py --mode "$MODE"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: |
            data/outputs/pipeline_checkpoint.json
            data/outputs/pipeline_health.json
            data/outputs/weekly_report.json
            data/outputs/dashboard_snapshot.json
          if-no-files-found: ignore

      - name: Save ChromaDB cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/chroma_db
            ~/.cache/huggingface
            ~/.cache/torch
          key: pipeline-chroma-${{ hashFiles('requirements.txt') }}
